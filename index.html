<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaskeun Ngoding - Workshop Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="kartu">
    <header class="banner">
      <button type="button" id="tombolTema" class="tema" aria-label="Ganti tema gelap/terang">🌙</button>
      <div class="banner-ikon">🚀</div>
      <h1 id="judul">Workshop Web untuk pemula</h1>
      <p class="tagline">Workshop Anti Gabut✨</p>
      <p>Slot terbatas. Isi data kamu di bawah!</p>
    </header>

    <div class="isi">
      <form id="formWorkshop" novalidate>
        <div class="field">
          <label for="nama">Nama kamu</label>
          <div class="input-wrap">
            <span class="ikon" aria-hidden="true">😎</span>
            <input id="nama" name="nama" type="text" maxlength="40" autocomplete="name" placeholder="masukkan nama kamu">
          </div>
          <small class="error" id="errNama" aria-live="polite"></small>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <span class="ikon" aria-hidden="true">📩</span>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="nama@email.com (yang aktif ya)">
          </div>
          <small class="error" id="errEmail" aria-live="polite"></small>
        </div>

        <div class="field">
          <label for="sesi">Pilih sesi andalan kamu</label>
          <div class="input-wrap">
            <span class="ikon" aria-hidden="true">🔥</span>
            <select id="sesi" name="sesi">
              <option value="">-- Mau ikut sesi yang mana? --</option>
              <option value="Sesi 1 - Web Anti Ngebug: HTML & CSS (09.00)">Sesi 1 - Web Anti Ngebug: HTML &amp; CSS (09.00)</option>
              <option value="Sesi 2 - JavaScript Bikin Web Hidup: DOM (11.00)">Sesi 2 - JavaScript Bikin Web Hidup: DOM (11.00)</option>
              <option value="Sesi 3 - Cyber Security: Jangan Mau Kena Hack! (13.00)">Sesi 3 - Cyber Security: Jangan Mau Kena Hack! (13.00)</option>
              <option value="Sesi 4 - Web Responsif Biar Aesthetic di HP (15.00)">Sesi 4 - Web Responsif Biar Aesthetic di HP (15.00)</option>
            </select>
          </div>
          <small class="info" id="infoSesi"></small>
          <small class="error" id="errSesi" aria-live="polite"></small>
        </div>

        <div class="field">
          <label for="catatan">Ekspektasi kamu (opsional)</label>
          <textarea id="catatan" name="catatan" rows="3" maxlength="120" placeholder="Curhat dikit, pengen jago apa nih?"></textarea>
          <small class="info">Jumlah karakter: <span id="jumlahKarakter">0</span>/120</small>
        </div>

        <div class="aksi">
          <button type="submit" class="utama">Gas Daftar! 🚀</button>
          <button type="button" id="tombolReset" class="sekunder">Ulang</button>
        </div>
      </form>

      <p id="pesanForm" class="pesan" aria-live="polite"></p>

      <section class="tiket" aria-labelledby="judulRingkasan">
        <h2 id="judulRingkasan">🎟️ Tiket Kamu</h2>
        <ul>
          <li><strong>Nama</strong><span id="rNama">-</span></li>
          <li><strong>Email</strong><span id="rEmail">-</span></li>
          <li><strong>Sesi</strong><span id="rSesi">-</span></li>
        </ul>
      </section>
    </div>
  </main>
</body>
</html>
